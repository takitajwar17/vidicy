name: Deploy Vidicy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-agency:
    if: github.repository_id == '1424743538'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: vidicy-agency-production
      cancel-in-progress: false
    name: Deploy Agency to Cloud Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: eco-azimuth-441108-s4
          workload_identity_provider: projects/600776052247/locations/global/workloadIdentityPools/github/providers/vidicy
          service_account: vidicy-agency-deploy@eco-azimuth-441108-s4.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build Agency container
        run: |
          gcloud builds submit . \
            --project=eco-azimuth-441108-s4 \
            --region=asia-southeast1 \
            --config=apps/agency/cloudbuild.yaml \
            --gcs-source-staging-dir=gs://eco-azimuth-441108-s4-vidicy-build-source/source \
            --substitutions="_IMAGE_TAG=${{ github.sha }}" \
            --quiet

      - name: Deploy Agency container
        # PostgreSQL schema changes need a separate reviewed migration before
        # rollout. This job does not execute old D1 migrations.
        run: |
          IMAGE="asia-southeast1-docker.pkg.dev/eco-azimuth-441108-s4/vidicy/agency:${{ github.sha }}"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project=eco-azimuth-441108-s4 --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid container image digest" >&2; exit 1; }
          gcloud run services update vidicy-agency \
            --project=eco-azimuth-441108-s4 \
            --region=asia-southeast1 \
            --image="${IMAGE%:*}@${DIGEST}" \
            --quiet
